/* =====================================
   ESCAPE HTML
===================================== */

/**
 * @param {any} text
 * @returns {string}
 */
function escapeHtml(text){

    if(text === null || text === undefined){
        return "";
    }

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =====================================
   LOAD PRODUCTS
===================================== */
async function loadProducts(){

    const status = document.getElementById("status");

    if(!status){
        console.error("STATUS ELEMENT NOT FOUND");
        return;
    }

    status.textContent = "Connecting to Firestore...";

    try {

        console.log("Starting Firestore request...");

        const snapshot = await db
            .collection("products")
            .get();

        console.log(
            "FIRESTORE SUCCESS:",
            snapshot.size,
            "products found"
        );

        allProducts = [];

        snapshot.forEach(function(doc){

            console.log("PRODUCT:", doc.id, doc.data());

            allProducts.push({
                id: doc.id,
                ...doc.data()
            });

        });

        allProducts.sort(function(a, b){

            const aTime =
                a.createdAt &&
                typeof a.createdAt.toMillis === "function"
                ? a.createdAt.toMillis()
                : 0;

            const bTime =
                b.createdAt &&
                typeof b.createdAt.toMillis === "function"
                ? b.createdAt.toMillis()
                : 0;

            return bTime - aTime;

        });

        console.log(
            "TOTAL PRODUCTS:",
            allProducts.length
        );

        displayProducts(allProducts);

        if(allProducts.length === 0){

            status.textContent =
                "No products yet.";

        }else{

            status.textContent =
                allProducts.length +
                " product(s) available";

        }

    } catch(error){

        console.error(
            "FIRESTORE ERROR:",
            error
        );

        status.textContent =
            "Firebase error: " +
            error.message;

    }

}

    



/* =====================================
   DISPLAY PRODUCTS
===================================== */

/**
 * @param {Array<any>} products
 */
function displayProducts(products){

    const container =
        document.getElementById("products");

    if(!container){
        return;
    }

    if(products.length === 0){

        container.innerHTML =
            '<div class="empty">No product found.</div>';

        return;
    }

    container.innerHTML =
        products
            .map(
                /**
                 * @param {any} product
                 */
                function(product){

                    const name =
                        escapeHtml(
                            product.name || "Product"
                        );

                    const price =
                        escapeHtml(
                            product.price || "0"
                        );

                    const description =
                        escapeHtml(
                            product.description || ""
                        );

                    const image =
                        escapeHtml(
                            product.image || ""
                        );

                    const productId =
                        escapeHtml(
                            String(product.id || "")
                        );

                    return `
                        <div class="product">

                            <img
                                class="product-img"
                                src="${image}"
                                alt="${name}"
                                onerror="this.style.display='none'"
                            >

                            <div class="product-info">

                                <div class="product-name">
                                    ${name}
                                </div>

                                <div class="price">
                                    Rs. ${price}
                                </div>

                                <div class="description">
                                    ${description}
                                </div>

                                <div class="buttons">
${isAdmin ? `

        class="btn"
        onclick="editProduct('${productId}')">
        ✏️ EDIT
    </button>

    <button
        class="btn"
        onclick="deleteProduct('${productId}')">
        🗑️ DELETE
    </button>
` : ""}
                                    <button
                                        class="btn details-btn"
                                        onclick="openDetails('${productId}')">
                                        VIEW DETAILS

                                    <button
                                        class="btn whatsapp-btn"

                                        WHATSAPP
                                    </button
                                </div>

                            </div>

                        </div>
                    `;
                }
            )
            .join("");
}

async function deleteProduct(id) {
    if (!confirm("Delete this product?")) return;

    try {
        await db.collection("products").doc(id).delete();
        alert("Product deleted!");
        loadProducts();
    } catch (error) {
        alert("Delete error: " + error.message);
    }
}

async function editProduct(id) {
    const product = allProducts.find(function(p) {
        return p.id === id;
    });

    if (!product) return;

    const name = prompt("Product name:", product.name || "");
    if (name === null) return;

    const price = prompt("Price:", product.price || "");
    if (price === null) return;

    const description = prompt(
        "Description:",
        product.description || ""
    );
    if (description === null) return;

    try {
        await db.collection("products").doc(id).update({
            name: name,
            price: price,
            description: description
        });

        alert("Product updated!");
        loadProducts();

    } catch (error) {
        alert("Edit error: " + error.message);
    }
}

const searchInput =

if(searchInput){

    searchInput.addEventListener(
        "input",
        /**
         * @param {Event} event
         */
        function(event){

            const target =
                event.target;

            const query =
                target &&
                "value" in target
                ? String(target.value).toLowerCase().trim()
                : "";

            if(!query){

                displayProducts(allProducts);

                return;
            }

            const filtered =
                allProducts.filter(
                    /**
                     * @param {any} product
                     */
                    function(product){

                        const name =
                            String(
                                product.name || ""
                            ).toLowerCase();

                        const description =
                            String(
                                product.description || ""
                            ).toLowerCase();

                        return (
                            name.includes(query) ||
                            description.includes(query)
                        );
                    }
                );

            displayProducts(filtered);

        }
    );
}
